name: Publish to PyPI

# Runs when you publish a GitHub Release. Tests, builds, and uploads to PyPI
# via trusted publishing (OpenID Connect) -- no API token is stored anywhere.
# One-time setup on PyPI is described in RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch: {}   # also allow a manual run from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,rich]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chaos-bringer
    permissions:
      id-token: write   # the only permission trusted publishing needs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
