name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with rich + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[rich,dev]"
      - name: Run tests
        run: python -m pytest -q

  gate-selfcheck:
    name: security gate self-check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: The gate must DETECT a known-vulnerable agent (expect exit 1)
        run: |
          set +e
          chaos-agents run campaigns/demo_echo.yaml --format sarif --output gate.sarif
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "::error::expected the gate to fail (exit 1) on the vulnerable demo target, got $code"
            exit 1
          fi
          echo "Gate correctly flagged the vulnerable demo target (exit 1)."
      - name: Upload the demo SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-demo-sarif
          path: gate.sarif
          if-no-files-found: warn
